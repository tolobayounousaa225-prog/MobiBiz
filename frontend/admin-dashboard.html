<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — MobiBiz</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/api.js"></script>
<script>Auth.requireAuth();</script>
<script src="assets/js/admin-layout.js"></script>
<script>
  renderAdminLayout("admin-dashboard", "Administration MobiBiz", "Vue d'ensemble de la plateforme");

  const content = document.getElementById("pageContent");
  content.innerHTML = `
    <div class="kpi-grid" id="kpiGrid">
      <div class="kpi"><div class="label">Boutiques actives</div><div class="value green">—</div></div>
      <div class="kpi"><div class="label">Boutiques suspendues</div><div class="value red">—</div></div>
      <div class="kpi"><div class="label">Boutiques à l'essai</div><div class="value amber">—</div></div>
      <div class="kpi"><div class="label">Total boutiques</div><div class="value">—</div></div>
      <div class="kpi"><div class="label">Utilisateurs</div><div class="value">—</div></div>
      <div class="kpi"><div class="label">Commandes traitées</div><div class="value">—</div></div>
      <div class="kpi"><div class="label">CA total plateforme</div><div class="value orange">—</div></div>
    </div>
    <div class="card">
      <h2>Revenus plateforme</h2>
      <div class="kpi-grid" id="revenueKpis">
        <div class="kpi"><div class="label">MRR estimé</div><div class="value orange">—</div></div>
        <div class="kpi"><div class="label">Encaissé ce mois-ci</div><div class="value green">—</div></div>
        <div class="kpi"><div class="label">Total encaissé (historique)</div><div class="value">—</div></div>
      </div>
      <div id="planRepartition" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2>Évolution (6 derniers mois)</h2>
      <div id="evolutionChart"></div>
    </div>
    <div class="card">
      <h2>Paiements à échéance (5 prochains jours ou en retard)</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Boutique</th><th>Propriétaire</th><th>Statut</th><th>Échéance</th><th></th></tr></thead>
          <tbody id="dueBody"><tr><td colspan="5" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>Boutiques suspendues</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Boutique</th><th>Propriétaire</th><th>Plan</th><th></th></tr></thead>
          <tbody id="suspendedBody"><tr><td colspan="4" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>
      <a href="admin-boutiques.html" class="btn small secondary" style="margin-top:10px;display:inline-flex">Voir toutes les boutiques</a>
    </div>
  `;

  const STATUS_LABELS = {
    essai: ["Essai", "amber"],
    actif: ["Actif", "green"],
    suspendu: ["Suspendu", "red"],
  };

  const PLAN_LABELS = { free: "Free", starter: "Starter", pro: "Pro", business: "Business", enterprise: "Enterprise" };

  const MOIS_LABELS = ["Jan", "Fév", "Mar", "Avr", "Mai", "Juin", "Juil", "Août", "Sep", "Oct", "Nov", "Déc"];

  function renderEvolutionChart(data) {
    const width = 640, height = 220, barGap = 14;
    const chartTop = 16, chartBottom = 170;
    const barWidth = (width - barGap * (data.length + 1)) / data.length;
    const maxCa = Math.max(...data.map((d) => d.chiffre_affaires), 1);

    const bars = data.map((d, i) => {
      const x = barGap + i * (barWidth + barGap);
      const barHeight = (d.chiffre_affaires / maxCa) * (chartBottom - chartTop);
      const y = chartBottom - barHeight;
      const [year, month] = d.mois.split("-");
      const label = `${MOIS_LABELS[Number(month) - 1]}`;
      return `
        <rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" fill="var(--orange)" rx="4"></rect>
        <text x="${x + barWidth / 2}" y="${chartBottom + 18}" text-anchor="middle" font-size="12" fill="var(--ink-soft)">${label}</text>
        <text x="${x + barWidth / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="var(--ink)">${fmtFCFA(d.chiffre_affaires)}</text>
        <text x="${x + barWidth / 2}" y="${chartBottom + 34}" text-anchor="middle" font-size="11" fill="var(--ink-soft)">${d.nouvelles_boutiques} bout. / ${d.commandes} cmd.</text>
      `;
    }).join("");

    document.getElementById("evolutionChart").innerHTML = `
      <div style="overflow-x:auto">
        <svg viewBox="0 0 ${width} ${height}" style="width:100%;max-width:${width}px;height:auto">
          <line x1="0" y1="${chartBottom}" x2="${width}" y2="${chartBottom}" stroke="var(--border)"></line>
          ${bars}
        </svg>
      </div>
    `;
  }

  async function load() {
    const [stats, shops, evolution, revenue] = await Promise.all([
      api("/api/admin/statistiques"),
      api("/api/admin/boutiques"),
      api("/api/admin/statistiques/evolution?mois=6"),
      api("/api/admin/statistiques/revenus"),
    ]);
    renderEvolutionChart(evolution);

    const revenueValues = document.querySelectorAll("#revenueKpis .value");
    revenueValues[0].textContent = fmtFCFA(revenue.mrr_estime);
    revenueValues[1].textContent = fmtFCFA(revenue.encaisse_mois_courant);
    revenueValues[2].textContent = fmtFCFA(revenue.total_encaisse);
    document.getElementById("planRepartition").innerHTML = revenue.repartition_plans.length === 0
      ? `<p class="empty">Aucune boutique active pour l'instant</p>`
      : revenue.repartition_plans.map((r) => `<span class="badge gray" style="margin-right:6px">${PLAN_LABELS[r.plan] || r.plan} : ${r.nombre}</span>`).join("");

    const values = document.querySelectorAll("#kpiGrid .value");
    values[0].textContent = stats.boutiques_actives;
    values[1].textContent = stats.boutiques_suspendues;
    values[2].textContent = stats.boutiques_essai;
    values[3].textContent = stats.boutiques_total;
    values[4].textContent = stats.utilisateurs_total;
    values[5].textContent = stats.commandes_total;
    values[6].textContent = fmtFCFA(stats.chiffre_affaires_total);

    const today = new Date(); today.setHours(0, 0, 0, 0);
    const due = shops.filter((s) => {
      if (!s.prochain_paiement_le || s.abonnement_statut === "suspendu") return false;
      const diffDays = Math.round((new Date(s.prochain_paiement_le + "T00:00:00") - today) / 86400000);
      return diffDays <= 5;
    });
    document.getElementById("dueBody").innerHTML = due.length === 0
      ? `<tr><td colspan="5" class="empty">Aucune échéance proche</td></tr>`
      : due.map((s) => `
          <tr>
            <td>${s.nom}</td>
            <td>${s.proprietaire_nom} — ${s.proprietaire_telephone}</td>
            <td>${badge(STATUS_LABELS, s.abonnement_statut)}</td>
            <td>${paymentDueBadge(s.prochain_paiement_le)}</td>
            <td><a href="admin-boutiques.html" class="btn secondary small">Gérer</a></td>
          </tr>
        `).join("");

    const suspended = shops.filter((s) => s.abonnement_statut === "suspendu");
    const body = document.getElementById("suspendedBody");
    body.innerHTML = suspended.length === 0
      ? `<tr><td colspan="4" class="empty">Aucune boutique suspendue</td></tr>`
      : suspended.map((s) => `
          <tr>
            <td>${s.nom}</td>
            <td>${s.proprietaire_nom} — ${s.proprietaire_telephone}</td>
            <td>${PLAN_LABELS[s.abonnement_plan] || s.abonnement_plan}</td>
            <td><a href="admin-boutiques.html" class="btn secondary small">Gérer</a></td>
          </tr>
        `).join("");
  }

  load().catch((err) => toast(err.message, "error"));
</script>
</body>
</html>
