<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Administration MobiBiz</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/api.js"></script>
<script>Auth.requireAuth();</script>
<script src="assets/js/admin-layout.js"></script>
<script>
  renderAdminLayout("admin-tickets", "Support", "Tickets envoyés par les boutiques");

  const STATUT_LABELS = { ouvert: ["Ouvert", "amber"], resolu: ["Résolu", "green"] };

  const content = document.getElementById("pageContent");
  content.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <select id="statusFilter">
          <option value="">Tous</option>
          <option value="ouvert">Ouverts</option>
          <option value="resolu">Résolus</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Boutique</th><th>Sujet</th><th>Statut</th><th>Date</th><th></th></tr></thead>
          <tbody id="ticketsBody"><tr><td colspan="5" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>
    </div>
  `;

  document.body.insertAdjacentHTML("beforeend", `
    <div class="modal-backdrop hidden" id="ticketModalBackdrop">
      <div class="modal">
        <button class="modal-close" id="closeTicketModal">&times;</button>
        <h2 id="ticketModalTitle">Ticket</h2>
        <div id="ticketMessages" style="margin-bottom:14px"></div>
        <label for="replyMessage">Répondre</label>
        <textarea id="replyMessage" rows="2"></textarea>
        <div class="form-actions">
          <button class="btn" id="sendReplyBtn">Envoyer</button>
          <button class="btn secondary" id="toggleStatusBtn"></button>
        </div>
      </div>
    </div>
  `);

  let tickets = [];
  let currentTicketId = null;

  function renderTickets() {
    const filter = document.getElementById("statusFilter").value;
    const rows = filter ? tickets.filter((t) => t.statut === filter) : tickets;
    const body = document.getElementById("ticketsBody");
    body.innerHTML = rows.length === 0
      ? `<tr><td colspan="5" class="empty">Aucun ticket</td></tr>`
      : rows.map((t) => `
          <tr>
            <td>${t.boutique_nom || "-"}</td>
            <td>${t.sujet}</td>
            <td>${badge(STATUT_LABELS, t.statut)}</td>
            <td>${fmtDate(t.created_at)}</td>
            <td><button class="btn secondary small" data-open="${t.id}">Ouvrir</button></td>
          </tr>
        `).join("");
    body.querySelectorAll("[data-open]").forEach((btn) => {
      btn.addEventListener("click", () => openTicket(tickets.find((t) => t.id === Number(btn.dataset.open))));
    });
  }

  function openTicket(ticket) {
    currentTicketId = ticket.id;
    document.getElementById("ticketModalTitle").textContent = `${ticket.sujet} — ${ticket.boutique_nom || ""}`;
    document.getElementById("ticketMessages").innerHTML = ticket.messages.map((m) => `
      <div style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="font-size:12.5px;color:var(--ink-soft)">${m.auteur_nom} (${m.auteur_role === "admin" ? "Admin" : "Boutique"}) — ${new Date(m.created_at).toLocaleString("fr-FR")}</div>
        <div style="margin-top:2px">${m.message}</div>
      </div>
    `).join("");
    document.getElementById("replyMessage").value = "";
    document.getElementById("toggleStatusBtn").textContent = ticket.statut === "ouvert" ? "Marquer résolu" : "Rouvrir";
    document.getElementById("ticketModalBackdrop").classList.remove("hidden");
  }

  document.getElementById("closeTicketModal").addEventListener("click", () =>
    document.getElementById("ticketModalBackdrop").classList.add("hidden"));

  document.getElementById("sendReplyBtn").addEventListener("click", async () => {
    const message = document.getElementById("replyMessage").value.trim();
    if (!message) return;
    try {
      const updated = await api(`/api/admin/tickets/${currentTicketId}/messages`, { method: "POST", body: { message } });
      tickets = tickets.map((t) => (t.id === updated.id ? updated : t));
      openTicket(updated);
      renderTickets();
      toast("Réponse envoyée", "success");
    } catch (err) { toast(err.message, "error"); }
  });

  document.getElementById("toggleStatusBtn").addEventListener("click", async () => {
    const ticket = tickets.find((t) => t.id === currentTicketId);
    const newStatus = ticket.statut === "ouvert" ? "resolu" : "ouvert";
    try {
      const updated = await api(`/api/admin/tickets/${currentTicketId}/statut`, { method: "PATCH", body: { statut: newStatus } });
      tickets = tickets.map((t) => (t.id === updated.id ? updated : t));
      openTicket(updated);
      renderTickets();
      toast("Statut mis à jour", "success");
    } catch (err) { toast(err.message, "error"); }
  });

  document.getElementById("statusFilter").addEventListener("change", renderTickets);

  async function load() {
    tickets = await api("/api/admin/tickets");
    renderTickets();
  }

  load().catch((err) => toast(err.message, "error"));
</script>
</body>
</html>
