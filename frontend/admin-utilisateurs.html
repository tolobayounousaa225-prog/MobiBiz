<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utilisateurs — Administration MobiBiz</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/api.js"></script>
<script>Auth.requireAuth();</script>
<script src="assets/js/admin-layout.js"></script>
<script>
  renderAdminLayout("admin-utilisateurs", "Utilisateurs", "Tous les comptes de la plateforme (support, dépannage)");

  const ROLE_LABELS = {
    owner: ["Propriétaire", "blue"],
    employee: ["Employé", "gray"],
    admin: ["Admin", "orange"],
  };

  const content = document.getElementById("pageContent");
  content.innerHTML = `
    <div class="card">
      <h2>Administrateurs de la plateforme</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nom</th><th>Téléphone</th><th>Rôle admin</th><th>Statut</th><th>Créé le</th></tr></thead>
          <tbody id="adminsBody"><tr><td colspan="5" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>
      <button class="btn small hidden" id="newAdminBtn" style="margin-top:10px">+ Nouvel administrateur</button>
    </div>

    <div class="card">
      <h2>Tous les comptes</h2>
      <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Rechercher par nom ou téléphone…">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nom</th><th>Téléphone</th><th>Rôle</th><th>Boutique</th><th>Statut</th><th>Inscrit le</th></tr></thead>
          <tbody id="usersBody"><tr><td colspan="6" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>
    </div>
  `;

  document.body.insertAdjacentHTML("beforeend", `
    <div class="modal-backdrop hidden" id="adminModalBackdrop">
      <div class="modal">
        <button class="modal-close" id="closeAdminModal">&times;</button>
        <h2>Nouvel administrateur</h2>
        <p style="color:var(--ink-soft);font-size:13px">
          Accès total à la supervision de la plateforme — à réserver à des personnes de confiance.
        </p>
        <form id="adminForm">
          <div class="field-row">
            <div><label for="a_prenom">Prénom</label><input type="text" id="a_prenom" required></div>
            <div><label for="a_nom">Nom</label><input type="text" id="a_nom" required></div>
          </div>
          <label for="a_telephone">Téléphone</label>
          <input type="tel" id="a_telephone" required>
          <label for="a_password">Mot de passe</label>
          <input type="password" id="a_password" required minlength="6" placeholder="6 caractères minimum">
          <label for="a_role">Rôle</label>
          <select id="a_role">
            <option value="support">Support (tickets et consultation uniquement)</option>
            <option value="super">Complet (suspension, plans, paramètres, création d'admins)</option>
          </select>
          <div class="form-actions">
            <button type="submit" class="btn">Créer</button>
          </div>
        </form>
      </div>
    </div>
  `);

  let users = [];

  function renderUsers() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    const rows = users.filter((u) =>
      `${u.prenom} ${u.nom}`.toLowerCase().includes(q) || u.telephone.includes(q)
    );
    const body = document.getElementById("usersBody");
    body.innerHTML = rows.length === 0
      ? `<tr><td colspan="6" class="empty">Aucun utilisateur trouvé</td></tr>`
      : rows.map((u) => `
          <tr>
            <td>${u.prenom} ${u.nom}</td>
            <td>${u.telephone}</td>
            <td>${badge(ROLE_LABELS, u.role)}${u.employee_role ? ` <span style="color:var(--ink-soft);font-size:12px">(${u.employee_role})</span>` : ""}</td>
            <td>${u.boutique_nom || "-"}</td>
            <td>${u.actif ? `<span class="badge green">Actif</span>` : `<span class="badge gray">Désactivé</span>`}</td>
            <td>${fmtDate(u.created_at)}</td>
          </tr>
        `).join("");
  }

  document.getElementById("searchInput").addEventListener("input", renderUsers);

  const ADMIN_ROLE_LABELS = { super: ["Complet", "orange"], support: ["Support", "gray"] };

  async function loadAdmins() {
    const admins = await api("/api/admin/administrateurs");
    document.getElementById("adminsBody").innerHTML = admins.map((a) => `
      <tr>
        <td>${a.prenom} ${a.nom}</td>
        <td>${a.telephone}</td>
        <td>${a.admin_role ? badge(ADMIN_ROLE_LABELS, a.admin_role) : "-"}</td>
        <td>${a.actif ? `<span class="badge green">Actif</span>` : `<span class="badge gray">Désactivé</span>`}</td>
        <td>${fmtDate(a.created_at)}</td>
      </tr>
    `).join("");
  }

  document.getElementById("newAdminBtn").addEventListener("click", () => {
    document.getElementById("adminForm").reset();
    document.getElementById("adminModalBackdrop").classList.remove("hidden");
  });
  document.getElementById("closeAdminModal").addEventListener("click", () =>
    document.getElementById("adminModalBackdrop").classList.add("hidden"));

  document.getElementById("adminForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api("/api/admin/administrateurs", {
        method: "POST",
        body: {
          prenom: document.getElementById("a_prenom").value.trim(),
          nom: document.getElementById("a_nom").value.trim(),
          telephone: document.getElementById("a_telephone").value.trim(),
          password: document.getElementById("a_password").value,
          admin_role: document.getElementById("a_role").value,
        },
      });
      document.getElementById("adminModalBackdrop").classList.add("hidden");
      await Promise.all([loadAdmins(), load()]);
      toast("Administrateur créé", "success");
    } catch (err) { toast(err.message, "error"); }
  });

  async function load() {
    users = await api("/api/admin/utilisateurs");
    renderUsers();
  }

  (async () => {
    try {
      const me = await api("/api/auth/me");
      document.getElementById("newAdminBtn").classList.toggle("hidden", me.admin_role !== "super");
      await Promise.all([load(), loadAdmins()]);
    } catch (err) { toast(err.message, "error"); }
  })();
</script>
</body>
</html>
