<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — MobiBiz</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { background: var(--bg); }
  .shop-header {
    background: var(--ink); color: #fff; padding: 32px 20px; text-align: center;
  }
  .shop-header h1 { margin: 0 0 6px; font-size: 24px; }
  .shop-header p { margin: 2px 0; color: #c7c9d8; font-size: 13.5px; }
  .shop-wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 100px; }
  .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .product-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column;
  }
  .product-card .name { font-weight: 600; font-size: 14.5px; margin-bottom: 4px; }
  .product-card .price { color: var(--orange-dark); font-weight: 700; margin-bottom: 10px; }
  .product-card .desc { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; flex: 1; }
  .cart-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink); color: #fff;
    padding: 14px 20px; display: none; align-items: center; justify-content: space-between; z-index: 40;
  }
  .cart-bar.visible { display: flex; }
  .category-tabs { display: flex; gap: 8px; overflow-x: auto; margin: 18px 0; padding-bottom: 4px; }
  .category-tabs button {
    border: 1px solid var(--border); background: #fff; padding: 6px 14px; border-radius: 999px;
    font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .category-tabs button.active { background: var(--orange); color: #fff; border-color: var(--orange); }
</style>
</head>
<body>
<script src="assets/js/api.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");
  let shopData = null;
  let categories = [];
  let cart = {}; // cartKey -> { product, variant, qty }

  function cartKey(productId, variantId) { return `${productId}:${variantId || 0}`; }

  async function loadShop() {
    if (!slug) {
      document.body.innerHTML = `<div class="shop-wrap"><p class="empty">Boutique introuvable (lien invalide).</p></div>`;
      return;
    }
    try {
      shopData = await api(`/api/public/boutiques/${encodeURIComponent(slug)}`);
      categories = shopData.categories;
      renderShop();
    } catch (err) {
      document.body.innerHTML = `<div class="shop-wrap"><p class="empty">Cette boutique n'est pas disponible actuellement.</p></div>`;
    }
  }

  function categoryName(id) {
    const c = categories.find((c) => c.id === id);
    return c ? c.nom : null;
  }

  function renderShop() {
    document.body.insertAdjacentHTML("afterbegin", `
      <div class="shop-header">
        <h1>${shopData.nom}</h1>
        ${shopData.description ? `<p>${shopData.description}</p>` : ""}
        ${shopData.commune ? `<p>📍 ${shopData.commune}</p>` : ""}
        ${shopData.whatsapp ? `<p>📱 WhatsApp : ${shopData.whatsapp}</p>` : ""}
      </div>
      <div class="shop-wrap">
        <div class="category-tabs" id="categoryTabs"></div>
        <div class="product-grid" id="productGrid"></div>
      </div>
      ${shopData.whatsapp ? `
        <a href="${waLink(shopData.whatsapp, `Bonjour, je viens de votre boutique ${shopData.nom} en ligne.`)}" target="_blank" rel="noopener"
           style="position:fixed;bottom:80px;right:20px;background:#25D366;color:#fff;width:52px;height:52px;border-radius:50%;
                  display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:var(--shadow);z-index:45;text-decoration:none">
          💬
        </a>
      ` : ""}
      <div class="cart-bar" id="cartBar">
        <span id="cartSummary"></span>
        <button class="btn" id="openCheckoutBtn">Commander</button>
      </div>
    `);

    const tabs = document.getElementById("categoryTabs");
    tabs.innerHTML = `<button class="active" data-cat="">Tous</button>` +
      categories.map((c) => `<button data-cat="${c.id}">${c.nom}</button>`).join("");
    tabs.querySelectorAll("button").forEach((btn) => {
      btn.addEventListener("click", () => {
        tabs.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderProducts(btn.dataset.cat);
      });
    });

    renderProducts("");
    injectCheckoutModal();
  }

  function hasPromo(p) { return p.promo_actif && p.prix_promo != null; }
  function effectivePrice(p) { return hasPromo(p) ? p.prix_promo : p.prix_vente; }

  function renderProducts(categoryFilter) {
    const grid = document.getElementById("productGrid");
    const list = categoryFilter
      ? shopData.produits.filter((p) => String(p.category_id || "") === categoryFilter)
      : shopData.produits;

    if (list.length === 0) {
      grid.innerHTML = `<p class="empty">Aucun produit disponible</p>`;
      return;
    }

    grid.innerHTML = list.map((p) => `
      <div class="product-card">
        ${p.image_url ? `<img src="${API_BASE}${p.image_url}" alt="${p.nom}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:8px;cursor:pointer" data-open="${p.id}">` : ""}
        <div class="name" style="cursor:pointer" data-open="${p.id}">${p.nom}</div>
        ${categoryName(p.category_id) ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:4px">${categoryName(p.category_id)}</div>` : ""}
        ${p.nombre_avis > 0 ? `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:4px">${"★".repeat(Math.round(p.note_moyenne))}${"☆".repeat(5 - Math.round(p.note_moyenne))} (${p.nombre_avis})</div>` : ""}
        <div class="desc">${p.description || ""}</div>
        <div class="price">${p.has_variants
          ? `dès ${fmtFCFA(Math.min(...p.variants.map((v) => v.prix_vente)))}`
          : (hasPromo(p)
            ? `<span style="text-decoration:line-through;color:var(--ink-soft);font-weight:400;font-size:12.5px">${fmtFCFA(p.prix_vente)}</span> <span class="badge orange">Promo ${fmtFCFA(p.prix_promo)}</span>`
            : fmtFCFA(p.prix_vente))}</div>
        <button class="btn small" data-add="${p.id}">${p.has_variants ? "Choisir" : "Ajouter"}</button>
      </div>
    `).join("");

    grid.querySelectorAll("[data-open]").forEach((el) => {
      el.addEventListener("click", () => openProductModal(shopData.produits.find((p) => p.id === Number(el.dataset.open))));
    });
    grid.querySelectorAll("[data-add]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const product = shopData.produits.find((p) => p.id === Number(btn.dataset.add));
        if (product.has_variants) {
          openProductModal(product);
        } else {
          addToCart(product, null, 1);
        }
      });
    });
  }

  function addToCart(product, variant, qty) {
    const availableStock = variant ? variant.stock : product.stock;
    const key = cartKey(product.id, variant ? variant.id : null);
    if (!cart[key]) cart[key] = { product, variant, qty: 0 };
    if (cart[key].qty + qty > availableStock) {
      toast("Stock disponible atteint", "error");
      return;
    }
    cart[key].qty += qty;
    updateCartBar();
    toast(`${product.nom}${variant ? ` (${variant.nom})` : ""} ajouté`, "success");
  }

  function cartUnitPrice(entry) {
    return entry.variant ? entry.variant.prix_vente : effectivePrice(entry.product);
  }

  function updateCartBar() {
    const entries = Object.values(cart).filter((e) => e.qty > 0);
    const bar = document.getElementById("cartBar");
    if (entries.length === 0) { bar.classList.remove("visible"); return; }
    const totalQty = entries.reduce((s, e) => s + e.qty, 0);
    const total = entries.reduce((s, e) => s + e.qty * cartUnitPrice(e), 0);
    document.getElementById("cartSummary").textContent = `${totalQty} article(s) — ${fmtFCFA(total)}`;
    bar.classList.add("visible");
  }

  async function openProductModal(product) {
    const modal = document.getElementById("productDetailBackdrop");
    document.getElementById("pd_title").textContent = product.nom;
    const mainImageBox = document.getElementById("pd_image");
    const setMainImage = (url) => {
      mainImageBox.innerHTML = url
        ? `<img src="${url}" alt="" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-bottom:8px">` : "";
    };
    setMainImage(product.image_url ? `${API_BASE}${product.image_url}` : null);

    const images = product.images || [];
    document.getElementById("pd_gallery").innerHTML = images.map((img) => `
      <img src="${API_BASE}${img.image_url}" alt="" data-thumb style="width:52px;height:52px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--border)">
    `).join("");
    document.querySelectorAll("#pd_gallery [data-thumb]").forEach((thumb) => {
      thumb.addEventListener("click", () => setMainImage(thumb.src));
    });

    document.getElementById("pd_desc").textContent = product.description || "";

    const variantBox = document.getElementById("pd_variant_box");
    const availableVariants = (product.variants || []).filter((v) => v.stock > 0);
    if (product.has_variants) {
      variantBox.innerHTML = `
        <label for="pd_variant">Choisissez une option</label>
        <select id="pd_variant">${availableVariants.map((v) => `<option value="${v.id}">${v.nom} — ${fmtFCFA(v.prix_vente)} (stock ${v.stock})</option>`).join("")}</select>
      `;
    } else {
      variantBox.innerHTML = `<div class="price" style="margin:8px 0">${hasPromo(product)
        ? `<span style="text-decoration:line-through;color:var(--ink-soft);font-weight:400;font-size:12.5px">${fmtFCFA(product.prix_vente)}</span> <span class="badge orange">Promo ${fmtFCFA(product.prix_promo)}</span>`
        : fmtFCFA(product.prix_vente)}</div>`;
    }

    document.getElementById("pd_qty").value = 1;
    document.getElementById("pd_add_btn").onclick = () => {
      const qty = Number(document.getElementById("pd_qty").value) || 1;
      if (product.has_variants) {
        const variantId = Number(document.getElementById("pd_variant").value);
        const variant = availableVariants.find((v) => v.id === variantId);
        if (!variant) { toast("Aucune variante disponible", "error"); return; }
        addToCart(product, variant, qty);
      } else {
        addToCart(product, null, qty);
      }
      document.getElementById("productDetailBackdrop").classList.add("hidden");
    };

    document.getElementById("pd_reviews").innerHTML = `<p class="empty">Chargement des avis…</p>`;
    modal.classList.remove("hidden");

    try {
      const summary = await api(`/api/public/boutiques/${encodeURIComponent(slug)}/produits/${product.id}/avis`);
      const reviewsHtml = summary.avis.length === 0
        ? `<p class="empty">Aucun avis pour l'instant — soyez le premier !</p>`
        : summary.avis.map((r) => `
            <div style="padding:8px 0;border-bottom:1px solid var(--border)">
              <div style="display:flex;justify-content:space-between"><strong>${r.nom_client}</strong><span>${"★".repeat(r.note)}${"☆".repeat(5 - r.note)}</span></div>
              ${r.commentaire ? `<p style="margin:4px 0;font-size:13px">${r.commentaire}</p>` : ""}
            </div>
          `).join("");
      document.getElementById("pd_reviews").innerHTML = `
        <h3 style="font-size:14px;margin:16px 0 8px">Avis clients ${summary.total > 0 ? `(${summary.moyenne}★ · ${summary.total})` : ""}</h3>
        ${reviewsHtml}
        <button class="btn secondary small" id="pd_show_review_form" style="margin-top:8px">Laisser un avis</button>
        <form id="pd_review_form" class="hidden" style="margin-top:10px">
          <label for="pd_review_nom">Votre nom</label>
          <input type="text" id="pd_review_nom" required>
          <label for="pd_review_note">Note</label>
          <select id="pd_review_note">
            <option value="5">★★★★★</option>
            <option value="4">★★★★☆</option>
            <option value="3">★★★☆☆</option>
            <option value="2">★★☆☆☆</option>
            <option value="1">★☆☆☆☆</option>
          </select>
          <label for="pd_review_comment">Commentaire (optionnel)</label>
          <textarea id="pd_review_comment" rows="2"></textarea>
          <div class="form-actions"><button type="submit" class="btn small">Envoyer l'avis</button></div>
        </form>
      `;
      document.getElementById("pd_show_review_form").addEventListener("click", () => {
        document.getElementById("pd_review_form").classList.remove("hidden");
      });
      document.getElementById("pd_review_form").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          await api(`/api/public/boutiques/${encodeURIComponent(slug)}/produits/${product.id}/avis`, {
            method: "POST",
            body: {
              nom_client: document.getElementById("pd_review_nom").value.trim(),
              note: Number(document.getElementById("pd_review_note").value),
              commentaire: document.getElementById("pd_review_comment").value.trim() || null,
            },
          });
          document.getElementById("pd_reviews").innerHTML = `<p class="empty">Merci ! Votre avis sera visible après validation par le commerçant.</p>`;
          toast("Avis envoyé", "success");
        } catch (err) { toast(err.message, "error"); }
      });
    } catch (err) {
      document.getElementById("pd_reviews").innerHTML = "";
    }
  }

  function injectCheckoutModal() {
    document.body.insertAdjacentHTML("beforeend", `
      <div class="modal-backdrop hidden" id="productDetailBackdrop">
        <div class="modal">
          <button class="modal-close" id="closeProductDetail">&times;</button>
          <h2 id="pd_title"></h2>
          <div id="pd_image"></div>
          <div id="pd_gallery" style="display:flex;gap:6px;margin-bottom:10px"></div>
          <p id="pd_desc" style="color:var(--ink-soft);font-size:13.5px"></p>
          <div id="pd_variant_box"></div>
          <label for="pd_qty">Quantité</label>
          <input type="number" id="pd_qty" min="1" value="1" style="width:100px">
          <div class="form-actions"><button type="button" class="btn" id="pd_add_btn">Ajouter au panier</button></div>
          <div id="pd_reviews"></div>
        </div>
      </div>

      <div class="modal-backdrop hidden" id="checkoutBackdrop">
        <div class="modal">
          <button class="modal-close" id="closeCheckout">&times;</button>
          <h2>Finaliser la commande</h2>
          <div id="cartItemsList"></div>
          <form id="checkoutForm">
            <label for="pc_nom">Votre nom</label>
            <input type="text" id="pc_nom" required>
            <label for="pc_tel">Votre téléphone</label>
            <input type="tel" id="pc_tel" required>
            <label for="pc_commune">Commune (optionnel)</label>
            <input type="text" id="pc_commune">
            <label for="pc_coupon">Code promo (optionnel)</label>
            <input type="text" id="pc_coupon" style="text-transform:uppercase" placeholder="Ex: PROMO10">
            <div class="form-actions">
              <button type="submit" class="btn" id="submitOrderBtn">Envoyer la commande</button>
            </div>
          </form>
          <div id="checkoutResult"></div>
        </div>
      </div>
    `);

    document.getElementById("closeProductDetail").addEventListener("click", () =>
      document.getElementById("productDetailBackdrop").classList.add("hidden"));

    document.getElementById("openCheckoutBtn").addEventListener("click", () => {
      const entries = Object.values(cart).filter((e) => e.qty > 0);
      document.getElementById("cartItemsList").innerHTML = entries.map((e) => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13.5px">
          <span>${e.product.nom}${e.variant ? ` (${e.variant.nom})` : ""} × ${e.qty}</span>
          <span>${fmtFCFA(cartUnitPrice(e) * e.qty)}</span>
        </div>
      `).join("");
      document.getElementById("pc_coupon").value = "";
      document.getElementById("checkoutResult").innerHTML = "";
      document.getElementById("checkoutForm").style.display = "block";
      document.getElementById("checkoutBackdrop").classList.remove("hidden");
    });

    document.getElementById("closeCheckout").addEventListener("click", () =>
      document.getElementById("checkoutBackdrop").classList.add("hidden"));

    document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const entries = Object.values(cart).filter((v) => v.qty > 0);
      if (entries.length === 0) { toast("Votre panier est vide", "error"); return; }

      const btn = document.getElementById("submitOrderBtn");
      btn.disabled = true;
      try {
        const result = await api(`/api/public/boutiques/${encodeURIComponent(slug)}/commandes`, {
          method: "POST",
          body: {
            client_nom: document.getElementById("pc_nom").value.trim(),
            client_telephone: document.getElementById("pc_tel").value.trim(),
            client_commune: document.getElementById("pc_commune").value.trim() || null,
            coupon_code: document.getElementById("pc_coupon").value.trim() || null,
            items: entries.map((e) => ({ product_id: e.product.id, variant_id: e.variant ? e.variant.id : null, quantite: e.qty })),
          },
        });
        document.getElementById("checkoutForm").style.display = "none";
        document.getElementById("checkoutResult").innerHTML = `
          <p style="text-align:center;padding:10px 0">
            ✅ Commande <strong>${result.numero}</strong> envoyée !<br>
            Total : <strong>${fmtFCFA(result.total)}</strong><br>
            <span style="color:var(--ink-soft);font-size:13px">Le commerçant vous contactera pour la suite.</span>
          </p>
        `;
        cart = {};
        updateCartBar();
      } catch (err) {
        toast(err.message, "error");
      } finally {
        btn.disabled = false;
      }
    });
  }

  loadShop();
</script>
</body>
</html>
