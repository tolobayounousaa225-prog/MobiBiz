<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma boutique — MobiBiz</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/api.js"></script>
<script>Auth.requireAuth();</script>
<script src="assets/js/layout.js"></script>
<script>
  renderLayout("boutique", "Ma boutique", "Informations affichées à vos clients");

  const content = document.getElementById("pageContent");
  content.innerHTML = `
    <div class="card" style="max-width:560px">
      <form id="shopForm">
        <label for="s_nom">Nom de la boutique</label>
        <input type="text" id="s_nom" required>

        <label for="s_description">Description</label>
        <textarea id="s_description" rows="3"></textarea>

        <div class="field-row">
          <div><label for="s_telephone">Téléphone</label><input type="tel" id="s_telephone"></div>
          <div><label for="s_whatsapp">WhatsApp</label><input type="tel" id="s_whatsapp"></div>
        </div>

        <div class="field-row">
          <div><label for="s_adresse">Adresse</label><input type="text" id="s_adresse"></div>
          <div><label for="s_commune">Commune</label><input type="text" id="s_commune"></div>
        </div>

        <label for="s_wave">Lien de paiement Wave (optionnel)</label>
        <input type="url" id="s_wave" placeholder="https://pay.wave.com/m/...">
        <p style="color:var(--ink-soft);font-size:12.5px;margin:4px 0 0">
          Récupérable dans l'app Wave Business → Paramètres → Lien de paiement. Une fois
          enregistré, un QR code apparaît ici et sur chaque commande — vos clients le
          scannent avec l'app Wave pour vous payer.
        </p>

        <div class="form-actions">
          <button type="submit" class="btn">Enregistrer</button>
        </div>
      </form>
      <div id="waveQrPreview" style="margin-top:18px"></div>
    </div>
  `;

  async function loadWaveQr() {
    const box = document.getElementById("waveQrPreview");
    const link = document.getElementById("s_wave").value.trim();
    if (!link) { box.innerHTML = ""; return; }
    try {
      const blob = await api("/api/boutique/wave-qr.png", { isBlob: true });
      const url = URL.createObjectURL(blob);
      box.innerHTML = `
        <label style="margin-top:0">QR code de paiement Wave</label>
        <img src="${url}" alt="QR code Wave" style="width:180px;height:180px;border:1px solid var(--border);border-radius:8px;padding:8px;background:#fff">
      `;
    } catch (err) {
      box.innerHTML = "";
    }
  }

  async function load() {
    const shop = await api("/api/boutique");
    document.getElementById("s_nom").value = shop.nom || "";
    document.getElementById("s_description").value = shop.description || "";
    document.getElementById("s_telephone").value = shop.telephone || "";
    document.getElementById("s_whatsapp").value = shop.whatsapp || "";
    document.getElementById("s_adresse").value = shop.adresse || "";
    document.getElementById("s_commune").value = shop.commune || "";
    document.getElementById("s_wave").value = shop.wave_payment_link || "";
    await loadWaveQr();
  }

  document.getElementById("shopForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      nom: document.getElementById("s_nom").value.trim(),
      description: document.getElementById("s_description").value.trim() || null,
      telephone: document.getElementById("s_telephone").value.trim() || null,
      whatsapp: document.getElementById("s_whatsapp").value.trim() || null,
      adresse: document.getElementById("s_adresse").value.trim() || null,
      commune: document.getElementById("s_commune").value.trim() || null,
      logo_url: null,
      wave_payment_link: document.getElementById("s_wave").value.trim() || null,
    };
    try {
      await api("/api/boutique", { method: "PUT", body: payload });
      toast("Boutique mise à jour", "success");
      await loadWaveQr();
    } catch (err) { toast(err.message, "error"); }
  });

  load().catch((err) => toast(err.message, "error"));
</script>
</body>
</html>
