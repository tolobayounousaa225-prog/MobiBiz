<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma boutique — MobiBiz</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/api.js"></script>
<script>Auth.requireAuth();</script>
<script src="assets/js/layout.js"></script>
<script>
  renderLayout("boutique", "Ma boutique", "Informations affichées à vos clients");

  const PLAN_LABELS = { free: "Free", starter: "Starter", pro: "Pro", business: "Business", enterprise: "Enterprise" };
  const STATUS_LABELS = {
    essai: ["Essai", "amber"],
    actif: ["Abonnement actif", "green"],
    suspendu: ["Compte suspendu", "red"],
  };

  const content = document.getElementById("pageContent");
  content.innerHTML = `
    <div class="card" style="max-width:560px" id="subscriptionCard"></div>
    <div class="card" style="max-width:560px" id="referralCard"></div>
    <div class="card" style="max-width:560px">
      <form id="shopForm">
        <label for="s_nom">Nom de la boutique</label>
        <input type="text" id="s_nom" required>

        <label for="s_description">Description</label>
        <textarea id="s_description" rows="3"></textarea>

        <div class="field-row">
          <div><label for="s_telephone">Téléphone</label><input type="tel" id="s_telephone"></div>
          <div><label for="s_whatsapp">WhatsApp</label><input type="tel" id="s_whatsapp"></div>
        </div>

        <div class="field-row">
          <div><label for="s_adresse">Adresse</label><input type="text" id="s_adresse"></div>
          <div><label for="s_commune">Commune</label><input type="text" id="s_commune"></div>
        </div>

        <label for="s_wave">Lien de paiement Wave (optionnel)</label>
        <input type="url" id="s_wave" placeholder="https://pay.wave.com/m/...">
        <p style="color:var(--ink-soft);font-size:12.5px;margin:4px 0 0">
          Récupérable dans l'app Wave Business → Paramètres → Lien de paiement. Une fois
          enregistré, un QR code apparaît ici et sur chaque commande — vos clients le
          scannent avec l'app Wave pour vous payer.
        </p>

        <label style="display:flex;align-items:center;gap:8px;font-weight:400;margin-top:18px">
          <input type="checkbox" id="s_publique" style="width:auto">
          Activer la boutique publique (consultable et commandable par vos clients sans compte)
        </label>
        <div id="publicLinkBox" style="margin:8px 0 0"></div>

        <div class="form-actions">
          <button type="submit" class="btn">Enregistrer</button>
        </div>
      </form>
      <div id="waveQrPreview" style="margin-top:18px"></div>
    </div>
  `;

  async function loadWaveQr() {
    const box = document.getElementById("waveQrPreview");
    const link = document.getElementById("s_wave").value.trim();
    if (!link) { box.innerHTML = ""; return; }
    try {
      const blob = await api("/api/boutique/wave-qr.png", { isBlob: true });
      const url = URL.createObjectURL(blob);
      box.innerHTML = `
        <label style="margin-top:0">QR code de paiement Wave</label>
        <img src="${url}" alt="QR code Wave" style="width:180px;height:180px;border:1px solid var(--border);border-radius:8px;padding:8px;background:#fff">
      `;
    } catch (err) {
      box.innerHTML = "";
    }
  }

  function publicShopUrl(slug) {
    const base = location.pathname.substring(0, location.pathname.lastIndexOf("/") + 1);
    return `${location.origin}${base}boutique-publique.html?slug=${encodeURIComponent(slug)}`;
  }

  function renderPublicLinkBox(shop) {
    const box = document.getElementById("publicLinkBox");
    if (!shop.boutique_publique_active) { box.innerHTML = ""; return; }
    const url = publicShopUrl(shop.slug);
    box.innerHTML = `
      <p style="font-size:13px;color:var(--ink-soft);margin:0 0 4px">Lien à partager avec vos clients :</p>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="text" readonly value="${url}" style="flex:1" onclick="this.select()">
        <button type="button" class="btn secondary small" id="copyPublicLinkBtn">Copier</button>
      </div>
    `;
    document.getElementById("copyPublicLinkBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(url);
        toast("Lien copié", "success");
      } catch (_) { toast("Impossible de copier automatiquement", "error"); }
    });
  }

  async function renderSubscriptionCard(shop) {
    document.getElementById("subscriptionCard").innerHTML = `
      <h2>Abonnement</h2>
      <p>${badge(STATUS_LABELS, shop.abonnement_statut)} — Plan <strong>${PLAN_LABELS[shop.abonnement_plan] || shop.abonnement_plan}</strong></p>
      ${shop.prochain_paiement_le ? `<p style="color:var(--ink-soft);font-size:13.5px">Prochaine échéance : ${paymentDueBadge(shop.prochain_paiement_le)}</p>` : ""}
      <div id="subscriptionQr"></div>
    `;
    try {
      const blob = await api("/api/abonnement/wave-qr.png", { isBlob: true });
      const url = URL.createObjectURL(blob);
      document.getElementById("subscriptionQr").innerHTML = `
        <p style="font-size:13px;color:var(--ink-soft);margin:10px 0 4px">Payer votre abonnement MobiBiz :</p>
        <img src="${url}" alt="QR paiement abonnement" style="width:150px;height:150px;border:1px solid var(--border);border-radius:8px;padding:8px;background:#fff">
      `;
    } catch (_) { /* pas encore configuré par l'administrateur */ }
  }

  function renderReferralCard(shop) {
    const inscriptionUrl = `${location.origin}${location.pathname.replace("boutique.html", "inscription.html")}?parrain=${shop.referral_code}`;
    const message = `Rejoins MobiBiz pour gérer ta boutique en ligne ! Inscris-toi avec mon code de parrainage ${shop.referral_code} : ${inscriptionUrl}`;
    document.getElementById("referralCard").innerHTML = `
      <h2>Programme de parrainage</h2>
      <p style="color:var(--ink-soft);font-size:13.5px;margin-top:0">
        Partagez votre code avec d'autres commerçants : à leur inscription, vous gagnez
        chacun 7 jours supplémentaires sur votre abonnement en cours.
      </p>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <input type="text" readonly value="${shop.referral_code}" style="flex:1;font-weight:700;font-size:16px;letter-spacing:1px" onclick="this.select()">
        <button type="button" class="btn secondary small" id="copyReferralBtn">Copier le message</button>
      </div>
      <p style="font-size:13px;color:var(--ink-soft)">${shop.nombre_parrainages} boutique(s) parrainée(s) jusqu'ici.</p>
    `;
    document.getElementById("copyReferralBtn").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(message);
        toast("Message copié", "success");
      } catch (_) { toast("Impossible de copier automatiquement", "error"); }
    });
  }

  async function load() {
    const shop = await api("/api/boutique");
    renderSubscriptionCard(shop);
    renderReferralCard(shop);
    document.getElementById("s_nom").value = shop.nom || "";
    document.getElementById("s_description").value = shop.description || "";
    document.getElementById("s_telephone").value = shop.telephone || "";
    document.getElementById("s_whatsapp").value = shop.whatsapp || "";
    document.getElementById("s_adresse").value = shop.adresse || "";
    document.getElementById("s_commune").value = shop.commune || "";
    document.getElementById("s_wave").value = shop.wave_payment_link || "";
    document.getElementById("s_publique").checked = !!shop.boutique_publique_active;
    renderPublicLinkBox(shop);
    await loadWaveQr();
  }

  document.getElementById("shopForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const payload = {
      nom: document.getElementById("s_nom").value.trim(),
      description: document.getElementById("s_description").value.trim() || null,
      telephone: document.getElementById("s_telephone").value.trim() || null,
      whatsapp: document.getElementById("s_whatsapp").value.trim() || null,
      adresse: document.getElementById("s_adresse").value.trim() || null,
      commune: document.getElementById("s_commune").value.trim() || null,
      logo_url: null,
      wave_payment_link: document.getElementById("s_wave").value.trim() || null,
      boutique_publique_active: document.getElementById("s_publique").checked,
    };
    try {
      const shop = await api("/api/boutique", { method: "PUT", body: payload });
      toast("Boutique mise à jour", "success");
      renderPublicLinkBox(shop);
      await loadWaveQr();
    } catch (err) { toast(err.message, "error"); }
  });

  load().catch((err) => toast(err.message, "error"));
</script>
</body>
</html>
