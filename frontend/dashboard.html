<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — MobiBiz</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/api.js"></script>
<script>Auth.requireAuth();</script>
<script src="assets/js/layout.js"></script>
<script>
  renderLayout("dashboard", "Tableau de bord", "Vue d'ensemble de votre activité");

  const EMPLOYEE_ROLE_LABELS = {
    manager: "Manager",
    vendeur: "Vendeur",
    magasinier: "Magasinier",
    comptable: "Comptable",
  };

  const content = document.getElementById("pageContent");
  content.innerHTML = `
    <div class="card" id="welcomeCard" style="display:none;padding:16px 20px"></div>
    <div class="kpi-grid" id="kpiGrid">
      <div class="kpi"><div class="label">Chiffre d'affaires</div><div class="value orange">—</div></div>
      <div class="kpi"><div class="label">Commandes</div><div class="value">—</div></div>
      <div class="kpi"><div class="label">Clients</div><div class="value">—</div></div>
      <div class="kpi"><div class="label">Produits</div><div class="value">—</div></div>
      <div class="kpi"><div class="label">Bénéfice estimé</div><div class="value green">—</div></div>
      <div class="kpi"><div class="label">Impayés</div><div class="value red">—</div></div>
    </div>
    <div class="card" id="alertCard" style="display:none">
      <h2>⚠️ Alertes stock</h2>
      <p id="alertText"></p>
      <a href="stock.html" class="btn small secondary">Voir le stock</a>
    </div>
    <div class="card">
      <h2>Dernières commandes</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>N°</th><th>Client</th><th>Total</th><th>Statut</th><th>Paiement</th><th>Date</th></tr></thead>
          <tbody id="ordersBody"><tr><td colspan="6" class="empty">Chargement…</td></tr></tbody>
        </table>
      </div>
    </div>
  `;

  async function load() {
    try {
      const [dash, orders, user] = await Promise.all([
        api("/api/dashboard"),
        api("/api/commandes"),
        api("/api/auth/me"),
      ]);

      const roleLabel = user.role === "owner" ? "Propriétaire" : (EMPLOYEE_ROLE_LABELS[user.employee_role] || "Employé");
      document.getElementById("welcomeCard").style.display = "block";
      document.getElementById("welcomeCard").innerHTML = `
        <span style="font-size:15px">👋 Bonjour, <strong>${user.prenom} ${user.nom}</strong></span>
        <span class="badge gray" style="margin-left:8px">${roleLabel}</span>
      `;

      const values = document.querySelectorAll("#kpiGrid .value");
      values[0].textContent = fmtFCFA(dash.chiffre_affaires);
      values[1].textContent = dash.nombre_commandes;
      values[2].textContent = dash.nombre_clients;
      values[3].textContent = dash.nombre_produits;
      values[4].textContent = fmtFCFA(dash.benefice_estime);
      values[5].textContent = fmtFCFA(dash.impayes);

      if (dash.produits_stock_faible > 0) {
        document.getElementById("alertCard").style.display = "block";
        document.getElementById("alertText").textContent =
          `${dash.produits_stock_faible} produit(s) en stock faible ou épuisé.`;
      }

      const body = document.getElementById("ordersBody");
      const recent = orders.slice(0, 8);
      if (recent.length === 0) {
        body.innerHTML = `<tr><td colspan="6" class="empty">Aucune commande pour l'instant</td></tr>`;
      } else {
        body.innerHTML = recent.map((o) => `
          <tr>
            <td>${o.numero}</td>
            <td>${o.customer_nom || "#" + o.customer_id}</td>
            <td>${fmtFCFA(o.total)}</td>
            <td>${badge(ORDER_STATUS_LABELS, o.statut)}</td>
            <td>${badge(PAIEMENT_STATUS_LABELS, o.paiement_statut)}</td>
            <td>${fmtDate(o.created_at)}</td>
          </tr>
        `).join("");
      }
    } catch (err) {
      toast(err.message, "error");
    }
  }

  load();
</script>
</body>
</html>
