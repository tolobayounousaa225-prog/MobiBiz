<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — MobiBiz</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="brand">Mobi<span>Biz</span></div>
    <p class="tagline">Vendez. Gérez. Développez.</p>

    <form id="loginForm">
      <label for="telephone">Numéro de téléphone</label>
      <input type="tel" id="telephone" required placeholder="07 00 00 00 01">

      <label for="password">Mot de passe</label>
      <input type="password" id="password" required placeholder="••••••••">

      <div class="error-msg" id="errorMsg"></div>

      <div class="form-actions">
        <button type="submit" class="btn" style="width:100%" id="submitBtn">Se connecter</button>
      </div>
    </form>

    <div class="switch-link">
      <a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a>
    </div>
    <div class="switch-link">
      Pas encore de boutique ? <a href="inscription.html">Créer un compte</a>
    </div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script>
  async function redirectAfterLogin() {
    try {
      const user = await api("/api/auth/me");
      window.location.href = user.role === "admin" ? "admin-dashboard.html" : "dashboard.html";
    } catch (_) {
      window.location.href = "dashboard.html";
    }
  }

  if (Auth.getToken()) redirectAfterLogin();

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById("errorMsg");
    const submitBtn = document.getElementById("submitBtn");
    errorMsg.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Connexion…";

    try {
      const data = await api("/api/auth/login", {
        method: "POST",
        body: {
          telephone: document.getElementById("telephone").value.trim(),
          password: document.getElementById("password").value,
        },
      });
      Auth.setToken(data.access_token);
      await redirectAfterLogin();
    } catch (err) {
      errorMsg.textContent = err.message;
      errorMsg.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Se connecter";
    }
  });
</script>
</body>
</html>
